# Test profile — override main db.properties với H2 in-memory.
# H2 mode=MySQL để tương thích syntax MySQL của JdbcAuctionDao/JdbcBidDao.
# DB_CLOSE_DELAY=-1 giữ DB sống trong suốt JVM (không drop khi connection cuối đóng).
db.url=jdbc:h2:mem:auction_test;MODE=MySQL;DB_CLOSE_DELAY=-1
db.user=sa
db.password=

db.pool.maxSize=20
db.pool.connectionTimeout=3000
